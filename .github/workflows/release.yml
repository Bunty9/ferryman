name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  # Dry run: builds and packages the binaries matrix only; nothing is
  # verified, published or released.
  workflow_dispatch:

permissions: {}

jobs:
  # Checks the tag, extracts release notes and runs the test suite. Only
  # `contents: read` — this job runs `cargo test`, which executes arbitrary
  # third-party code (build.rs, proc macros, test binaries), so it must
  # never hold a writable token. `persist-credentials: false` keeps
  # actions/checkout from even writing the (read-only) GITHUB_TOKEN into
  # .git/config, where a build script could read it.
  verify:
    name: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Verify tag points at a commit on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME (commit $GITHUB_SHA) is not an ancestor of origin/main"
            exit 1
          fi

      - name: Verify tag matches the workspace version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          pkg_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="ferryman") | .version')
          if [ "$tag" != "v${pkg_version}" ]; then
            echo "::error::tag $tag does not match [workspace.package] version $pkg_version (expected v${pkg_version})"
            exit 1
          fi
          core_version=$(sed -n \
            's/^ferryman-core = { path = "crates\/core", version = "\([^"]*\)".*/\1/p' \
            Cargo.toml)
          if [ "$core_version" != "$pkg_version" ]; then
            echo "::error::ferryman-core entry in [workspace.dependencies] ($core_version) does not match [workspace.package] version ($pkg_version)"
            exit 1
          fi
          echo "tag $tag matches version $pkg_version (ferryman-core dependency: $core_version)"

      - name: Extract CHANGELOG.md section
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ ("^## \\[" ver "\\]") { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no CHANGELOG.md section found for version $version"
            exit 1
          fi

      # Produced here (before publish) and reused by the `release` job,
      # since the actual publish must fail-fast on a bad tag/version/empty
      # changelog *before* anything irreversible happens, not after.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

  # Publishes both crates. `id-token: write` mints the crates.io Trusted
  # Publishing token; `contents: read` (never `write`) because `cargo
  # publish` also runs dependency build scripts. Each crate's publish is
  # idempotent (skipped if that exact version is already on crates.io), so
  # re-running this job after a partial failure resumes instead of
  # erroring on "already exists" — see docs/plans/2026-09-28-publishing.md
  # ("recovering from a half-published release").
  publish:
    name: publish
    needs: [verify, binaries, attest]
    if: >-
      !cancelled() && github.event_name == 'push'
      && needs.verify.result == 'success'
      && needs.binaries.result == 'success'
      && needs.attest.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish crates (idempotent, dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          pkg_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="ferryman") | .version')
          # ferryman depends on ferryman-core, so it must publish first.
          for crate in ferryman-core ferryman; do
            if curl -fsS -A "ferryman-release (github.com/Bunty9/ferryman)" \
                "https://crates.io/api/v1/crates/${crate}/${pkg_version}" >/dev/null 2>&1; then
              echo "$crate $pkg_version is already on crates.io, skipping"
            else
              echo "publishing $crate $pkg_version"
              cargo publish -p "$crate" --locked
            fi
          done

  # Release binaries, tier 1: required. `publish` needs this job, so
  # nothing irreversible (crates.io) happens unless every tier-1 archive
  # built. `contents: read` only, no OIDC. In a workflow_dispatch dry run
  # verify is skipped and only the two binaries jobs run.
  binaries:
    name: binary (${{ matrix.target }})
    needs: verify
    if: "!cancelled() && (needs.verify.result == 'success' || github.event_name == 'workflow_dispatch')"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tier: 1, os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { tier: 1, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { tier: 1, os: macos-latest, target: x86_64-apple-darwin }
          - { tier: 1, os: macos-latest, target: aarch64-apple-darwin }
          - { tier: 1, os: windows-latest, target: x86_64-pc-windows-msvc }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # rust-toolchain.toml pins stable; the target is added via rustup for
      # native builds.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      # Tier 1 only: embeds the dependency list (cargo-audit / trivy can read
      # it from the binary). Tier 2 is built without cargo-auditable.
      - name: Install cargo-auditable
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-auditable

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cargo auditable build --locked --release -p ferryman --target "$TARGET"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="ferryman") | .version')
          name="ferryman-v${version}-${TARGET}"
          exe=ferryman
          case "$TARGET" in *-windows-*) exe=ferryman.exe ;; esac
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/${exe}" README.md CHANGELOG.md \
            LICENSE-MIT LICENSE-APACHE config.toml "dist/$name/"
          cd dist
          case "$TARGET" in
            *-windows-*) archive="$name.zip"; 7z a -tzip "$archive" "$name" >/dev/null ;;
            *) archive="$name.tar.gz"; tar -czf "$archive" "$name" ;;
          esac
          rm -rf "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-t1-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7


  # Release binaries, tier 2: best effort (`continue-on-error`). Nothing
  # depends on it succeeding; `release` attaches whatever artifacts exist.
  binaries-extra:
    name: binary, best effort (${{ matrix.target }})
    needs: verify
    if: "!cancelled() && (needs.verify.result == 'success' || github.event_name == 'workflow_dispatch')"
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tier: 2, os: ubuntu-latest, target: armv7-unknown-linux-musleabihf, builder: cross }
          - { tier: 2, os: ubuntu-latest, target: arm-unknown-linux-musleabihf, builder: cross }
          - { tier: 2, os: ubuntu-latest, target: i686-unknown-linux-musl, builder: cross }
          - { tier: 2, os: ubuntu-latest, target: riscv64gc-unknown-linux-gnu, builder: cross }
          - { tier: 2, os: ubuntu-latest, target: x86_64-unknown-freebsd, builder: cross }
          - { tier: 2, os: windows-latest, target: aarch64-pc-windows-msvc, builder: cargo }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # rust-toolchain.toml pins stable; the target is added via rustup for
      # native builds. `cross` builds in a container, so no target there.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.builder == 'cargo' && matrix.target || '' }}

      - name: Install musl-tools
        if: matrix.builder == 'cargo' && contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install cross
        if: matrix.builder == 'cross'
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cross

      - name: Build
        shell: bash
        env:
          BUILDER: ${{ matrix.builder }}
        run: |
          set -euo pipefail
          "$BUILDER" build --locked --release -p ferryman --target "$TARGET"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="ferryman") | .version')
          name="ferryman-v${version}-${TARGET}"
          exe=ferryman
          case "$TARGET" in *-windows-*) exe=ferryman.exe ;; esac
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/${exe}" README.md CHANGELOG.md \
            LICENSE-MIT LICENSE-APACHE config.toml "dist/$name/"
          cd dist
          case "$TARGET" in
            *-windows-*) archive="$name.zip"; 7z a -tzip "$archive" "$name" >/dev/null ;;
            *) archive="$name.tar.gz"; tar -czf "$archive" "$name" ;;
          esac
          rm -rf "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-t2-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Build provenance for the tier-1 archives. Deliberately separate from the
  # build jobs: this is the only job with `id-token: write` + `attestations:
  # write`, and it checks out nothing and runs no cargo or repo code, only
  # downloads the archives and hands them to the attest action. `publish`
  # needs it, so nothing irreversible happens unless attestation succeeded.
  # It needs only tier 1 (not best-effort `binaries-extra`, which must not
  # delay or gate publish): tier-2 archives are NOT attested (their SHA256
  # files still ship). Skipped in workflow_dispatch dry runs so a dry run
  # never mints real attestations.
  attest:
    name: attest
    needs: [verify, binaries]
    if: >-
      !cancelled() && github.event_name == 'push'
      && needs.verify.result == 'success'
      && needs.binaries.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bin-t1-*
          path: dist
          merge-multiple: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

  # Creates (or, on a re-run, updates) the GitHub release from the notes
  # `verify` extracted and the archives `binaries` built. No checkout, no
  # cargo, no dependency code runs here; it is the only job that holds
  # `contents: write`. `!cancelled()` plus explicit result checks so a
  # failed tier-2 (`binaries-extra`) job can't skip the release, while
  # verify, publish and tier-1 `binaries` must all have succeeded.
  release:
    name: release
    needs: [verify, publish, binaries, binaries-extra, attest]
    if: >-
      !cancelled() && github.event_name == 'push'
      && needs.verify.result == 'success'
      && needs.publish.result == 'success'
      && needs.binaries.result == 'success'
      && needs.attest.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true

      - name: Check for required builds
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          missing=0
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl \
                   x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            case "$t" in *-windows-*) ext=zip ;; *) ext=tar.gz ;; esac
            f="dist/ferryman-v${version}-${t}.${ext}"
            if [ ! -f "$f" ] || [ ! -f "$f.sha256" ]; then
              echo "::error::required tier-1 build missing: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          ls -l dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum ferryman-v*.tar.gz ferryman-v*.zip > SHA256SUMS
          cd ..
          files=(dist/ferryman-v*.tar.gz dist/ferryman-v*.zip dist/*.sha256 dist/SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists, uploading assets"
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
            exit 0
          fi
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ferryman $version" \
            --notes-file release-notes.md \
            "${flags[@]}" \
            "${files[@]}"
