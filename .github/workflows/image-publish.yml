name: image-publish

# Manual recovery for a failed `image` / `image-attest` job of a published
# release: re-run from main's Dockerfile.release and scripts, using the
# attested archives of the given tag's GitHub release (a re-run of the tag's
# own run would use that tag's workflow file). See docs/plans/2026-09-28-publishing.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish the image for (e.g. v0.3.0)
        required: true
        type: string

permissions: {}

jobs:
  image:
    name: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-image
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      attestations: read # gh attestation verify
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ghcr.io/bunty9/ferryman
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

      # Checks out main (the job only runs there): Dockerfile.release and the
      # extract script.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The binaries were built from the tag's commit, not main's. The tags/
      # endpoint cannot match a same-named branch.
      - id: rev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" -q .sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Only the newest stable release may move X.Y / latest (no rollback).
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name)
          echo "is_latest=$([ "$latest" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Download the release's musl archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -D dist \
            -p 'ferryman-v*-x86_64-unknown-linux-musl.tar.gz*' \
            -p 'ferryman-v*-aarch64-unknown-linux-musl.tar.gz*' \
            -p SHA256SUMS

      - name: Verify checksums and build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.rev.outputs.sha }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --ignore-missing -c SHA256SUMS
          [ "$(sha256sum --ignore-missing -c SHA256SUMS | wc -l)" -eq 2 ]
          for a in ferryman-v*-unknown-linux-musl.tar.gz; do
            gh attestation verify "$a" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG" --source-digest "$SHA" \
              --deny-self-hosted-runners
          done

      - name: Unpack the musl binaries
        run: |
          set -euo pipefail
          version=$(scripts/extract-release-bins.sh dist bin)
          if [ "v${version}" != "$TAG" ]; then
            echo "::error::archives are for $version but the tag is $TAG"
            exit 1
          fi

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # X.Y and latest: stable and newest release only.
          # Not a tag-ref run, so the version comes from the input, not git.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ steps.rev.outputs.is_latest == 'true' && !contains(inputs.tag, '-') }}
            type=raw,value=latest,enable=${{ steps.rev.outputs.is_latest == 'true' && !contains(inputs.tag, '-') }}
          labels: |
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.title=ferryman
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
          annotations: |
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}

      # BuildKit pinned by digest (v0.34.0), and the Dockerfile uses the
      # builtin frontend (no `# syntax=` pull), so the build toolchain is fixed.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # No QEMU: the Dockerfile only COPYs, no RUN steps.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          sbom: false

  image-attest:
    name: image-attest
    needs: image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/bunty9/ferryman
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true
