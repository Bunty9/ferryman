name: docs

# Builds the mdBook in book/ on every PR and push; deploys it to GitHub Pages
# on pushes to main only. Crate API docs live on docs.rs, not here.
# One-time manual step: repo Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "book/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  MDBOOK_VERSION: "0.5.4"
  # sha256 of mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz (bump together).
  MDBOOK_SHA256: "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install mdBook (checksum-verified release binary)
        run: |
          set -euo pipefail
          f="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/${f}"
          echo "${MDBOOK_SHA256}  ${f}" | sha256sum -c -
          tar xzf "${f}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Build book
        run: mdbook build book
      - name: Test snippets
        run: mdbook test book
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: book/book

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
