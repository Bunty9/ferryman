# Fly.io deployment manifest for ferryman.
#
# Two-region failover demo: primary in `sin`, secondary in `iad`. One machine
# per region; Fly's global Anycast steers each client to its nearest region.
# Deploy with:
#   fly launch --copy-config --no-deploy
#   fly scale count 1 --region sin
#   fly scale count 1 --region iad
#   fly deploy

app = "ferryman"
primary_region = "sin"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  RUST_LOG = "info"
  FERRYMAN_CONFIG = "/app/config.toml"
  FERRYMAN_BIND = "0.0.0.0:8080"
  FERRYMAN_METRICS_BIND = "0.0.0.0:9090"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  internal_port = 9090
  protocol = "tcp"

  [[services.ports]]
    port = 9090
    handlers = ["http"]

[[regions]]
  code = "sin"

[[regions]]
  code = "iad"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
