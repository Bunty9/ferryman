name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        env:
          # rust-toolchain.toml pins stable already, but this keeps the
          # setup explicit and matches ci.yml's approach.
          RUSTUP_TOOLCHAIN: stable

      - name: Verify tag matches the workspace version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          pkg_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="ferryman") | .version')
          if [ "$tag" != "v${pkg_version}" ]; then
            echo "::error::tag $tag does not match [workspace.package] version $pkg_version (expected v${pkg_version})"
            exit 1
          fi
          core_version=$(sed -n \
            's/^ferryman-core = { path = "crates\/core", version = "\([^"]*\)".*/\1/p' \
            Cargo.toml)
          if [ "$core_version" != "$pkg_version" ]; then
            echo "::error::ferryman-core entry in [workspace.dependencies] ($core_version) does not match [workspace.package] version ($pkg_version)"
            exit 1
          fi
          echo "tag $tag matches version $pkg_version (ferryman-core dependency: $core_version)"

      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: cargo publish --workspace --locked
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Extract CHANGELOG.md section
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ ("^## \\[" ver "\\]") { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::no CHANGELOG.md section found for version $version"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, skipping"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "ferryman $version" \
            --notes-file /tmp/release-notes.md
