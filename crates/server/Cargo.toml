[package]
name = "ferryman"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Small L7 reverse proxy: prefix routing, per-upstream circuit breakers, active health checks, hot-reloaded TOML config, TLS termination."
documentation = "https://docs.rs/ferryman"
readme = "../../README.md"
keywords = ["reverse-proxy", "proxy", "circuit-breaker", "hyper", "http"]
categories = ["network-programming", "web-programming::http-server", "command-line-utilities"]

[lib]
name = "ferryman"
path = "src/lib.rs"

[[bin]]
name = "ferryman"
path = "src/main.rs"

[dependencies]
ferryman-core = { workspace = true }
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
arc-swap = { workspace = true }
notify = { workspace = true }
toml = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
metrics-util = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true, features = ["http2"] }

# cargo-binstall: fetch the prebuilt archive from the GitHub release
# (built by .github/workflows/release.yml).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"
