apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferryman
  labels:
    app.kubernetes.io/name: ferryman
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ferryman
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferryman
    spec:
      # shutdown_delay_secs (10) + drain_timeout_secs (15) + 10 s margin.
      terminationGracePeriodSeconds: 35
      securityContext: # Restricted Pod Security Standard
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532 # makes mounted Secrets (TLS) group-readable
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ferryman
          # Pin to the release you run; :0.3 follows 0.3.x patch releases.
          image: ghcr.io/bunty9/ferryman:0.3
          args:
            - --config=/etc/ferryman/ferryman.toml
            - --bind=0.0.0.0:8080
            - --metrics-bind=0.0.0.0:9090
            # Optional TLS: mount the Secret below and uncomment.
            # - --tls-cert=/etc/ferryman-tls/tls.crt
            # - --tls-key=/etc/ferryman-tls/tls.key
          ports:
            - name: proxy
              containerPort: 8080
            - name: admin
              containerPort: 9090
          readinessProbe:
            httpGet: {path: /readyz, port: admin}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # A directory mount, NOT subPath: subPath mounts never see
            # ConfigMap updates.
            - name: config
              mountPath: /etc/ferryman
              readOnly: true
            # - name: tls
            #   mountPath: /etc/ferryman-tls
            #   readOnly: true
      volumes:
        - name: config
          configMap:
            name: ferryman-config
        # - name: tls
        #   secret:
        #     secretName: ferryman-tls # kubernetes.io/tls: tls.crt + tls.key
