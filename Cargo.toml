[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/server",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Runtime + HTTP
tokio = { version = "1.47", features = ["full"] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
http-body-util = "0.1"

# TLS termination (Phase 2+; pinned for stack consistency with backend-cloud-roadmap §3)
# ring provider only; the default aws-lc-rs needs a C toolchain in the musl build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

# HTTP client (active health checker + benches)
# Plain-HTTP only: health probes never speak TLS, so no rustls/webpki here.
reqwest = { version = "0.12", default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Concurrency primitives
arc-swap = "1.7"

# Filesystem watching for hot-reload
notify = "6"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-util = { version = "0.19", default-features = false }
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = ["http-listener"] }

# Errors
anyhow = "1"
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# dev-dependencies that any workspace member may opt in to via
# `[dev-dependencies]` + `workspace = true`.
[workspace.dependencies.criterion]
version = "0.5"

[workspace.dependencies.proptest]
version = "1"

[workspace.dependencies.wiremock]
version = "0.6"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
