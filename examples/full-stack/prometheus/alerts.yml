groups:
  - name: ferryman
    rules:
      - alert: FerrymanDown
        expr: up{job="ferryman"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ferryman target is not being scraped"

      - alert: FerrymanCircuitOpen
        # > 0 (not == 1): ferryman_circuit_state is 0=closed, 1=open,
        # 2=half_open, and a half-open probe can briefly flip an open
        # breaker to 2 and back to 1. `== 1` would go false for that instant
        # and reset the `for:` pending timer; `> 0` stays true across an
        # open<->half-open flap, so a genuinely persistent outage still
        # fires after 30s instead of restarting its timer on every probe.
        expr: max by (upstream) (ferryman_circuit_state) > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker open (or half-open) for upstream {{ $labels.upstream }}"

      - alert: FerrymanUpstreamDown
        expr: min by (upstream) (ferryman_upstream_alive) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Upstream {{ $labels.upstream }} has been down for 2m"

      - alert: FerrymanHigh5xxRatio
        expr: sum(rate(ferryman_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(ferryman_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests are 5xx over the last 5m"

      - alert: FerrymanSlowP99
        expr: histogram_quantile(0.99, sum by (le, route) (rate(ferryman_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p99 latency for route {{ $labels.route }} above 500ms"
