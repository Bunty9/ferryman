name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins stable; this makes the beta leg really run beta.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install nextest
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest
      - name: Release script self-test
        run: bash scripts/test-extract-release-bins.sh
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo nextest
        run: cargo nextest run --workspace --no-fail-fast --locked
      # nextest does not run doctests.
      - name: cargo test --doc
        run: cargo test --doc --workspace --locked
      - name: library without default features
        run: |
          cargo check -p ferryman --no-default-features --locked
          cargo test -p ferryman --no-default-features --lib --locked
      - name: example crates are not publishable
        run: |
          cargo metadata --no-deps --format-version 1 \
            | jq -e '[.packages[] | select(.manifest_path | contains("/examples/")) | .publish] | all(. == [])'

  # Blocking: public API must stay semver-compatible with the last release
  # on crates.io (action default baseline = registry). Checks both crates.
  semver:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # The action installs its own toolchain (rust-toolchain input, default stable).
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9

  # Blocking: the declared rust-version (1.88) must really build.
  # rust-toolchain.toml pins stable, hence RUSTUP_TOOLCHAIN.
  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.88"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo check
        run: cargo check --workspace --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check

  bench:
    name: criterion (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo bench --no-run
        run: cargo bench --workspace --no-run

  wrk2-smoke:
    name: wrk2 smoke bench (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install wrk2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential libssl-dev libz-dev git
          git clone --depth=1 https://github.com/giltene/wrk2 /tmp/wrk2
          make -C /tmp/wrk2 -j"$(nproc)"
          sudo install /tmp/wrk2/wrk /usr/local/bin/wrk2
      - name: Run smoke bench against compose fixture
        run: bash scripts/wrk2-smoke.sh

  examples:
    name: examples
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Run full-stack example demo
        run: bash examples/full-stack/demo.sh --ci

  # Blocking on PRs and main: the Kubernetes recipe must stay admissible under
  # the Restricted Pod Security Standard and reload its ConfigMap without a
  # restart (kubelet sync, up to ~90 s).
  kind:
    name: kubernetes recipe (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          kubectl_version: v1.37.1
          cluster_name: ferryman
      - name: Build image and load it into kind
        run: |
          docker build -t ferryman:ci .
          kind load docker-image ferryman:ci --name ferryman
      - name: Deploy under the Restricted Pod Security Standard
        run: bash deploy/k8s/test/kind-test.sh

  # The release binaries also ship for Windows and macOS; build them on
  # every PR so platform breakage shows up before a tag does.
  cross-platform:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo build --release
        run: cargo build --locked --release -p ferryman

  zizmor:
    name: zizmor (workflow lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@5ca5fc7a4779c5263a3ffa0e1f693009994446d1 # v0.1.2
        with:
          inputs: .github/workflows
          version: 1.30.1
          advanced-security: false
